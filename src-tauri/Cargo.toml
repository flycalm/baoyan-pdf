[package]
name = "baoyan-pdf"
version = "0.2.0"
description = "A local Windows tool for organizing and merging postgraduate recommendation application PDFs"
authors = ["Baoyan PDF contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "baoyan_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
futures-util = "0.3"
hex = "0.4"
pdf-extract = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
  "brotli",
  "charset",
  "deflate",
  "gzip",
  "json",
  "native-tls",
  "stream",
] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
